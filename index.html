<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SimpleCam</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #fff;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      video.mirror {
        transform: scaleX(-1);
      }
      #controls {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        padding: 8px;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 8px;
        transition: opacity 0.3s;
      }
      body.idle #controls {
        opacity: 0;
        pointer-events: none;
      }
      body.idle {
        cursor: none;
      }
      button,
      select {
        font: inherit;
        color: #fff;
        background: #333;
        border: 1px solid #555;
        border-radius: 4px;
        padding: 6px 10px;
        cursor: pointer;
      }
      #error {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <video id="video" class="mirror" autoplay playsinline muted></video>
    <div id="error"></div>
    <div id="controls">
      <select id="camera" title="Camera"></select>
      <button id="mirror" title="Mirror (m)">Mirror</button>
      <button id="fullscreen" title="Fullscreen (f)">Fullscreen</button>
    </div>
    <script>
      const video = document.getElementById('video')
      const cameraSelect = document.getElementById('camera')
      const errorEl = document.getElementById('error')
      let stream

      function showError(msg) {
        errorEl.textContent = msg
        errorEl.style.display = 'flex'
      }

      async function start(deviceId) {
        if (stream) stream.getTracks().forEach((t) => t.stop())
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: deviceId ? { deviceId: { exact: deviceId } } : { width: { ideal: 1920 }, height: { ideal: 1080 } },
            audio: false
          })
          video.srcObject = stream
          errorEl.style.display = 'none'
        } catch (err) {
          showError(`Could not open camera: ${err.message}`)
        }
      }

      async function listCameras() {
        const devices = await navigator.mediaDevices.enumerateDevices()
        const current = stream?.getVideoTracks()[0]?.getSettings().deviceId
        cameraSelect.innerHTML = ''
        devices
          .filter((d) => d.kind === 'videoinput')
          .forEach((d, i) => {
            const opt = document.createElement('option')
            opt.value = d.deviceId
            opt.textContent = d.label || `Camera ${i + 1}`
            opt.selected = d.deviceId === current
            cameraSelect.appendChild(opt)
          })
      }

      function toggleFullscreen() {
        if (document.fullscreenElement) {
          document.exitFullscreen()
        } else {
          document.documentElement.requestFullscreen()
        }
      }

      function toggleMirror() {
        video.classList.toggle('mirror')
      }

      cameraSelect.addEventListener('change', () => start(cameraSelect.value))
      document.getElementById('mirror').addEventListener('click', toggleMirror)
      document.getElementById('fullscreen').addEventListener('click', toggleFullscreen)
      video.addEventListener('dblclick', toggleFullscreen)

      document.addEventListener('keydown', (e) => {
        if (e.key === 'f') toggleFullscreen()
        if (e.key === 'm') toggleMirror()
      })

      document.addEventListener('fullscreenchange', () => {
        document.getElementById('fullscreen').textContent = document.fullscreenElement ? 'Exit Fullscreen' : 'Fullscreen'
      })

      // hide controls & cursor after inactivity
      let idleTimer
      function wake() {
        document.body.classList.remove('idle')
        clearTimeout(idleTimer)
        idleTimer = setTimeout(() => document.body.classList.add('idle'), 2500)
      }
      document.addEventListener('mousemove', wake)
      document.addEventListener('touchstart', wake)
      wake()

      if (!navigator.mediaDevices?.getUserMedia) {
        showError('Camera API unavailable. Open over https or localhost.')
      } else {
        start().then(listCameras)
        navigator.mediaDevices.addEventListener('devicechange', listCameras)
      }
    </script>
  </body>
</html>
